# Keeps the free Supabase project from pausing during quiet weeks.
# Reads the database address and public key from .env.production.
name: Keep database awake
on:
  schedule:
    - cron: '17 20 * * *' # daily, early morning Brisbane time
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the database
        run: |
          set -a; . ./.env.production; set +a
          curl --fail --silent --show-error -X POST "$VITE_SUPABASE_URL/rest/v1/rpc/ping" -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d '{}'
