# Keeps the free Supabase project from pausing during quiet weeks.
# Needs two repository secrets: SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (see docs/SETUP.md).
name: Keep database awake
on:
  schedule:
    - cron: '17 20 * * *' # daily, early morning Brisbane time
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$URL" ]; then echo "SUPABASE_URL secret not set yet; skipping"; exit 0; fi
          curl --fail --silent --show-error -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
